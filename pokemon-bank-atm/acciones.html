<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Bank - Cajero Automático</title>
    <!-- Framework CSS: Bootstrap 4 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            padding-top: 2rem;
        }
        .header-info {
            background: #007bff;
            color: white;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .action-btn {
            height: 100px;
            font-size: 1.25rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            border-radius: 10px;
            border: 2px solid #dee2e6;
            transition: 0.3s;
        }
        .action-btn:hover {
            background-color: #e9ecef;
            border-color: #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Información de la cuenta -->
        <div class="header-info d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h4 class="mb-1">Bienvenido, Ash Ketchum</h4>
                <p class="mb-0"><strong>Cuenta N°:</strong> 0987654321</p>
                <p class="mb-0 mt-2 h5"><strong>Saldo Actual: </strong>$<span id="saldoVisual">0.00</span></p>
            </div>
            <div class="mt-2 mt-md-0">
                <a href="index.html" class="btn btn-danger">Salir de la sesión</a>
            </div>
        </div>

        <h3 class="text-center mb-4">Seleccione una transacción</h3>

        <!-- Opciones del cajero -->
        <div class="row">
            <div class="col-md-6">
                <button class="btn btn-light btn-block action-btn text-primary" onclick="depositar()">Depositar</button>
            </div>
            <div class="col-md-6">
                <button class="btn btn-light btn-block action-btn text-primary" onclick="retirar()">Retirar</button>
            </div>
            <div class="col-md-6">
                <button class="btn btn-light btn-block action-btn text-primary" onclick="consultarSaldo()">Consultar Saldo</button>
            </div>
            <div class="col-md-6">
                <!-- Este botón abre el Modal de Bootstrap -->
                <button class="btn btn-light btn-block action-btn text-primary" data-toggle="modal" data-target="#modalServicios">Pago de Servicios</button>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="historial.html" class="btn btn-secondary mr-2">Ver Historial de Transacciones</a>
                <a href="grafico.html" class="btn btn-dark">Ver Gráfico de Análisis</a>
            </div>
        </div>
    </div>

    <!-- Modal de Bootstrap para seleccionar el servicio -->
    <div class="modal fade" id="modalServicios" tabindex="-1" aria-labelledby="modalServiciosLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title" id="modalServiciosLabel">Seleccione el servicio a pagar</h5>
            <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <button class="btn btn-outline-primary btn-block mb-3" onclick="procesarPago('Energía Eléctrica')">Energía Eléctrica</button>
            <button class="btn btn-outline-primary btn-block mb-3" onclick="procesarPago('Internet')">Internet</button>
            <button class="btn btn-outline-primary btn-block mb-3" onclick="procesarPago('Telefonía')">Telefonía</button>
            <button class="btn btn-outline-primary btn-block mb-3" onclick="procesarPago('Agua Potable')">Agua Potable</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts de Bootstrap (Requeridos para el Modal) y SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    
    <script>
        let saldo = parseFloat(localStorage.getItem('atm_saldo')) || 0;
        let historial = JSON.parse(localStorage.getItem('atm_historial')) || [];
        
        document.getElementById('saldoVisual').innerText = saldo.toFixed(2);

        function guardarEstado(tipo, monto) {
            const fecha = new Date().toLocaleDateString('es-SV');
            historial.push({ fecha, tipo, monto });
            localStorage.setItem('atm_saldo', saldo.toString());
            localStorage.setItem('atm_historial', JSON.stringify(historial));
            document.getElementById('saldoVisual').innerText = saldo.toFixed(2);
        }

        function depositar() {
            swal({ text: "Ingrese el monto a depositar:", content: "input", button: { text: "Depositar" } })
            .then(val => {
                let monto = parseFloat(val);
                if (monto > 0) {
                    saldo += monto;
                    guardarEstado("Depósito", monto);
                    swal("Éxito", `Se han depositado $${monto.toFixed(2)}`, "success");
                } else if(val !== null) {
                    swal("Error", "Monto inválido.", "error");
                }
            });
        }

        function retirar() {
            swal({ text: "Ingrese el monto a retirar:", content: "input", button: { text: "Retirar" } })
            .then(val => {
                let monto = parseFloat(val);
                if (monto > 0 && monto <= saldo) {
                    saldo -= monto;
                    guardarEstado("Retiro", -monto);
                    swal("Éxito", `Retiro de $${monto.toFixed(2)} exitoso.`, "success");
                } else if (monto > saldo) {
                    swal("Fondos insuficientes", "No tienes suficiente dinero.", "error");
                } else if(val !== null) {
                    swal("Error", "Monto inválido.", "error");
                }
            });
        }

        function consultarSaldo() {
            swal("Saldo Disponible", `Tu saldo actual es de $${saldo.toFixed(2)}`, "info");
        }

        function procesarPago(servicio) {
            // Cierra el modal de Bootstrap
            $('#modalServicios').modal('hide');
            
            // Abre la alerta para ingresar el monto con un ligero retraso
            setTimeout(() => {
                swal({
                    text: `Ingrese el monto a pagar de ${servicio}:`,
                    content: "input",
                    button: { text: "Pagar" }
                }).then(val => {
                    let monto = parseFloat(val);
                    if (monto > 0 && monto <= saldo) {
                        saldo -= monto;
                        // Registra exactamente el servicio pagado en el historial
                        guardarEstado(`Pago de Servicio: ${servicio}`, -monto);
                        swal("Éxito", `Pago de $${monto.toFixed(2)} por ${servicio} procesado.`, "success");
                    } else if (monto > saldo) {
                        swal("Fondos insuficientes", "No tienes dinero suficiente.", "error");
                    } else if(val !== null) {
                        swal("Error", "Monto inválido.", "error");
                    }
                });
            }, 400); 
        }
    </script>
</body>
</html>
