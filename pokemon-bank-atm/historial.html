<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Transacciones - Pokémon Bank</title>
    <!-- Framework CSS: Bootstrap 4 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light pt-4">
    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Historial de Transacciones</h4>
                <a href="acciones.html" class="btn btn-sm btn-light text-primary font-weight-bold">Volver al Menú</a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-bordered text-center">
                        <thead class="thead-light">
                            <tr>
                                <th>Fecha</th>
                                <th>Tipo de Transacción</th>
                                <th>Monto</th>
                            </tr>
                        </thead>
                        <tbody id="tablaHistorial">
                            <!-- Las transacciones se cargarán aquí dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Cargar historial del localStorage
        const historial = JSON.parse(localStorage.getItem('atm_historial')) || [];
        const tbody = document.getElementById('tablaHistorial');

        if (historial.length === 0) {
            tbody.innerHTML = "<tr><td colspan='3' class='text-muted p-4'>Aún no has realizado transacciones</td></tr>";
        } else {
            // Recorrer el array e inyectar filas
            historial.forEach(t => {
                let colorCls = t.monto >= 0 ? 'text-success' : 'text-danger';
                let signo = t.monto >= 0 ? '+' : '';
                tbody.innerHTML += `
                    <tr>
                        <td>${t.fecha}</td>
                        <td>${t.tipo}</td>
                        <td class="${colorCls} font-weight-bold">${signo}$${t.monto.toFixed(2)}</td>
                    </tr>`;
            });
        }
    </script>
</body>
</html>
